name: Pruebas Python

on:
  pull_request:
  push:
    branches:
      - main
      - feat/laboratorio1

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias de pruebas
        run: python -m pip install pandas pyarrow pyyaml pytest
      - name: Ejecutar pruebas
        run: python -m pytest -q
